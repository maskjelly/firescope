name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much detail as you can.
  - type: input
    id: version
    attributes:
      label: Firescope version
      description: Run `npx firescope --version`
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Run `node --version`
      placeholder: v22.20.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx firescope init my-app
        2. npm run dev
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste CLI output or error messages. Redact secrets and project ids if needed.
      render: shell
    validations:
      required: false
