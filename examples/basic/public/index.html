<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firescope Basic Example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: radial-gradient(circle at top left, #fbbf24, transparent 30%), #f8fafc;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 40px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4.5rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Firescope</h1>
      <p>A Firebase app with framework conventions, generated deploy output, and simple functions.</p>
    </main>
  </body>
</html>
